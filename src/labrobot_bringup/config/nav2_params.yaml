# Nav2 for labrobot: a camera-only differential drive, 0.42 x 0.41 m.

amcl:
  ros__parameters:
    use_sim_time: false
# NOTE: AMCL IS NOT USED. RTAB-Map provides map -> odom (see mapping.launch.py localization:=true).

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 200

controller_server:
  ros__parameters:
    use_sim_time: false
    # 10 Hz: leaves ~2.7 MODBUS transactions per cycle for the drives.
    controller_frequency: 10.0
    odom_topic: /odometry/filtered
    # Below this the robot is considered stuck.
    min_x_velocity_threshold: 0.002
    min_y_velocity_threshold: 0.5      # holonomic only; effectively disabled
    min_theta_velocity_threshold: 0.005
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker, follow_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      # 0.10 m: final error is 79-97 mm; tighter makes the robot hunt.
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10

    follow_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      # REGULATED PURE PURSUIT, not DWB.
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController

      desired_linear_vel: 0.06
      # Distance ahead on the path to aim at.
      lookahead_dist: 0.5
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.70
      # Scale the lookahead with speed.
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 6.0

      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.01
      approach_velocity_scaling_dist: 0.30

      # the "regulated" part: slow down for curves and for obstacles
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      # Below this radius of curvature the robot slows.
      regulated_linear_scaling_min_radius: 0.60
      regulated_linear_scaling_min_speed: 0.02
      cost_scaling_dist: 0.35
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0   # MUST equal the costmaps' cost_scaling_factor

      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      rotate_to_heading_angular_vel: 0.3
      max_angular_accel: 1.0

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0

      allow_reversing: false
      max_robot_pose_search_dist: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.21, 0.203], [0.21, -0.203], [-0.21, -0.203], [-0.21, 0.203]]"
      footprint_padding: 0.01
      plugins: [stvl_layer, inflation_layer]

      stvl_layer:
        # STVL: clears what the camera sees; unseen voxels fade after voxel_decay.
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 15.0
        decay_model: 0                # linear
        voxel_size: 0.05              # = costmap resolution
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1         # max with the layers below
        origin_z: 0.0
        publish_voxel_map: false      # CPU; turn on to inspect in Foxglove
        transform_tolerance: 0.3
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: depth_mark depth_clear
        depth_mark:
          data_type: PointCloud2
          topic: /camera/camera/depth/color/points
          marking: true
          clearing: false
          # 0.10-0.90 m: above floor noise, up to the robot's height
          obstacle_range: 2.0
          min_obstacle_height: 0.10
          max_obstacle_height: 0.90
          # FAIL CLOSED: no cloud for 1 s -> layer not current -> Nav2 will not drive
          expected_update_rate: 1.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: voxel               # downsample to one point per voxel (CPU)
          voxel_min_points: 0
          clear_after_reading: true
        depth_clear:
          data_type: PointCloud2
          topic: /camera/camera/depth/color/points
          marking: false
          clearing: true
          model_type: 0               # depth camera frustum
          min_z: 0.30                 # m along the optical axis: the D435's minimum depth
          max_z: 3.5                  # = the old raytrace_max_range
          horizontal_fov_angle: 1.40  # 80 deg
          vertical_fov_angle: 0.94    # 54 deg
          decay_acceleration: 5.0     # 1/s^2: seen-free voxels vanish within ~1 s
          # 0: STVL 2.3.4 never refreshes a clearing-only source; marking keeps 1 s.
          expected_update_rate: 0.0

      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.06
        z_voxels: 16
        max_obstacle_height: 0.90
        mark_threshold: 0
        observation_sources: depth_cloud
        depth_cloud:
          topic: /camera/camera/depth/color/points
          # FAIL CLOSED. Expect a cloud at least every 1.0 s (it arrives at ~15 Hz).
          expected_update_rate: 1.0
          max_obstacle_height: 0.90
          min_obstacle_height: 0.10
          clearing: true
          marking: true
          data_type: PointCloud2
          obstacle_max_range: 2.0
          obstacle_min_range: 0.30
          raytrace_max_range: 3.5
          raytrace_min_range: 0.30

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.21, 0.203], [0.21, -0.203], [-0.21, -0.203], [-0.21, 0.203]]"
      footprint_padding: 0.01
      plugins: [static_layer, stvl_layer, inflation_layer]

      stvl_layer:
        # STVL: clears what the camera sees; unseen voxels fade after voxel_decay.
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 15.0
        decay_model: 0                # linear
        voxel_size: 0.05              # = costmap resolution
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1         # max with the layers below
        origin_z: 0.0
        publish_voxel_map: false      # CPU; turn on to inspect in Foxglove
        transform_tolerance: 0.3
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: depth_mark depth_clear
        depth_mark:
          data_type: PointCloud2
          topic: /camera/camera/depth/color/points
          marking: true
          clearing: false
          # 0.10-0.90 m: above floor noise, up to the robot's height
          obstacle_range: 2.0
          min_obstacle_height: 0.10
          max_obstacle_height: 0.90
          # FAIL CLOSED: no cloud for 1 s -> layer not current -> Nav2 will not drive
          expected_update_rate: 1.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: voxel               # downsample to one point per voxel (CPU)
          voxel_min_points: 0
          clear_after_reading: true
        depth_clear:
          data_type: PointCloud2
          topic: /camera/camera/depth/color/points
          marking: false
          clearing: true
          model_type: 0               # depth camera frustum
          min_z: 0.30                 # m along the optical axis: the D435's minimum depth
          max_z: 3.5                  # = the old raytrace_max_range
          horizontal_fov_angle: 1.40  # 80 deg
          vertical_fov_angle: 0.94    # 54 deg
          decay_acceleration: 5.0     # 1/s^2: seen-free voxels vanish within ~1 s
          # 0: STVL 2.3.4 never refreshes a clearing-only source; marking keeps 1 s.
          expected_update_rate: 0.0


      # The RTAB-Map occupancy grid.
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: depth_cloud
        depth_cloud:
          topic: /camera/camera/depth/color/points
          expected_update_rate: 1.0   # fail closed
          data_type: PointCloud2
          max_obstacle_height: 0.90
          min_obstacle_height: 0.10   # above the depth noise at 2 m
          clearing: true
          marking: true
          obstacle_max_range: 2.0     # depth too noisy to mark beyond
          obstacle_min_range: 0.30
          raytrace_max_range: 3.5
          raytrace_min_range: 0.30    # clear wherever the sensor sees

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Must match the local costmap's inflation.
        inflation_radius: 0.45
        cost_scaling_factor: 5.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      # Smac 2D: routes through gap centres (NavFn has a half-cell bias).
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.25
      downsample_costmap: false        # keep full 5 cm resolution for gaps
      allow_unknown: false
      max_planning_time: 2.0           # s; maps here plan in well under that
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    # Humble names: global_frame is the local costmap's frame (odom).
    global_frame: odom
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    robot_base_frame: base_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    # BackUp is the one recovery this robot should distrust.
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.15
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.15

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    # Hard ceiling for all Nav2 motion; missions still run at RPP's 0.06 m/s.
    max_velocity: [0.20, 0.0, 0.5]
    min_velocity: [-0.06, 0.0, -0.5]
    # Gentle: abrupt changes slam the swivel castors sideways.
    max_accel: [0.3, 0.0, 1.0]
    max_decel: [-0.4, 0.0, -1.2]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 2000   # ms: settles the robot, and RTAB-Map gets still frames
