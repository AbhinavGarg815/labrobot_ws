collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /diff_drive_controller/cmd_vel_unstamped
    transform_tolerance: 0.3
    # The cloud arrives at 10-15 Hz; older than 1 s is not "now".
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [PolygonStop, FootprintApproach]
    # Footprint front edge is x = 0.21, half-width 0.203.
    PolygonStop:
      type: polygon
      points: [0.35, 0.24, 0.35, -0.24, 0.21, -0.24, 0.21, 0.24]
      action_type: stop
      # A few flying depth pixels must not stop the robot; a person's leg is hundreds of points.
      max_points: 10
      visualize: true
      polygon_pub_topic: collision_monitor/polygon_stop
      enabled: true
    PolygonSlow:
      type: polygon
      points: [0.61, 0.30, 0.61, -0.30, 0.21, -0.30, 0.21, 0.30]
      action_type: slowdown
      max_points: 10
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: collision_monitor/polygon_slowdown
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.5
      simulation_time_step: 0.1
      max_points: 10
      visualize: false
      enabled: true
    observation_sources: [depth_cloud]
    depth_cloud:
      type: pointcloud
      topic: /camera/camera/depth/color/points
      min_height: 0.10
      max_height: 0.90
      enabled: true
