# Madgwick orientation filter for the D435i IMU.

imu_filter_madgwick:
  ros__parameters:
    # No magnetometer on the D435i, so yaw is unobservable in absolute terms.
    use_mag: false

    # ENU is the ROS convention (REP-103).
    world_frame: enu

    # The EKF owns odom -> base_footprint; never publish TF here.
    publish_tf: false

    # How hard the accelerometer is allowed to pull the gyro back towards gravity.
    gain: 0.05

    # Gyro bias is small but not zero (yaw bias 0.099 deg/s, which alone is 6 deg per minute).
    do_bias_estimation: true
    zeta: 0.02

    # The IMU arrives at ~200 Hz already timestamped; no need to reorder.
    use_magnetic_field_msg: false
    stateless: false
    remove_gravity_vector: false
